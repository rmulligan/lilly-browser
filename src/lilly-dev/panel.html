<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LillyBrowser — Development</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">DIGITAL PRESENCE · DEVELOPMENT</p>
      <h1>Lilly</h1>
    </header>
    <section aria-labelledby="presence-title" class="status">
      <p class="eyebrow">PRESENCE</p>
      <h2 id="presence-title">Not connected</h2>
      <p>This development shell cannot see or interact with your current page.</p>
    </section>
    <section aria-labelledby="capabilities-title">
      <h2 id="capabilities-title">Capabilities</h2>
      <dl>
        <div><dt>Page access</dt><dd>Unavailable</dd></div>
        <div><dt>Browser actions</dt><dd>Unavailable</dd></div>
        <div><dt>Inference</dt><dd>Disconnected</dd></div>
        <div><dt>Memory</dt><dd>Disconnected</dd></div>
      </dl>
    </section>
    <footer>Opening this panel does not invite Lilly into a page.</footer>
  </main>
</body>
</html>
